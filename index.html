<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* Online sem servidor: o celular que cria a sala vira o "servidor" (PeerJS/WebRTC) */
window.WFP2P=class{constructor(){const S=this,me=1e5+Math.random()*9e5|0,CD="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",cl=(x,n)=>String(x==null?"":x).replace(/[\u0000-\u001f<>]/g,"").trim().slice(0,n);
let pr=null,hc=null,R=null,cs={},nm="Piloto",pl=0;S.readyState=0;setTimeout(()=>{S.readyState=1;S.onopen&&S.onopen()},0);
const out=o=>{S.onmessage&&S.onmessage({data:JSON.stringify(o)})},err=m=>out({t:"err",m}),ri=()=>({c:R.c,host:me,pub:0,p:Object.values(R.p)}),
to=(o,ex)=>{for(const k in cs)k!=ex&&cs[k].open&&cs[k].send(o);ex!=me&&out(o)},
snd=(id,o)=>id==me?out(o):cs[id]&&cs[id].open&&cs[id].send(o),
drop=id=>{if(R&&R.p[id]){delete R.p[id];delete cs[id];to({t:"pq",id,host:me})}},
hd=(id,m)=>{const p=R.p[id];if(!p)return;
if(m.t==="st"&&Array.isArray(m.s))to({t:"st",id,s:m.s},id);
else if(m.t==="chat"){const x=cl(m.m,120);x&&to({t:"chat",id,n:p.n,m:x})}
else if(m.t==="plane"){p.pl=m.plane|0;to({t:"pj",id,n:p.n,pl:p.pl},id)}
else if(m.t==="x"){const o={t:"x",id,to:m.to|0,d:m.d};if(o.to){if(o.to==me)out(o);else snd(o.to,o)}else to(o,id)}
else if(m.t==="ping")snd(id,{t:"pong",c:+m.c||0})},
lv=()=>{const c=hc,p=pr;hc=null;pr=null;if(R){const o=cs;R=null;cs={};for(const k in o)try{o[k].close()}catch(e){}}try{c&&c.close()}catch(e){}try{p&&p.destroy()}catch(e){}},
mk=n=>{const c=Array.from({length:5},()=>CD[Math.random()*32|0]).join(""),p=new Peer("warflow-"+c);
p.on("error",e=>{try{p.destroy()}catch(x){}e.type==="unavailable-id"&&n<6?mk(n+1):err("Não consegui criar a sala ("+e.type+")")});
p.on("open",()=>{pr=p;R={c,p:{[me]:{id:me,n:nm,pl}}};try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{})}catch(e){}out({t:"room",...ri()})});
p.on("disconnected",()=>{try{p.reconnect()}catch(e){}});
p.on("connection",cn=>{cn.on("data",d=>{if(!R)return;if(d.t==="join"){if(Object.keys(R.p).length>=8){cn.send({t:"err",m:"Sala cheia"});setTimeout(()=>cn.close(),400);return}
const id=+d.id||0;if(!id||R.p[id]){cn.send({t:"err",m:"Erro ao entrar"});return}cn._id=id;cs[id]=cn;R.p[id]={id,n:cl(d.n,16)||"Piloto",pl:d.pl|0};cn.send({t:"room",...ri()});to({t:"pj",id,n:R.p[id].n,pl:R.p[id].pl},id)}else cn._id&&hd(cn._id,d)});
cn.on("close",()=>cn._id&&drop(cn._id))})},
jn=c=>{c=cl(c,5).toUpperCase();const p=new Peer();let ok=0;const f=t=>{if(!ok){ok=1;clearTimeout(tm);try{p.destroy()}catch(e){}err(t)}},
tm=setTimeout(()=>f("Não consegui conectar ao host (rede/firewall). Tente de novo."),15e3);
p.on("error",e=>f(e.type==="peer-unavailable"?"Sala não encontrada. O host precisa estar com o jogo aberto na tela.":"Erro de conexão ("+e.type+")"));
p.on("open",()=>{const cn=p.connect("warflow-"+c,{reliable:true,serialization:"json"});cn.on("open",()=>cn.send({t:"join",id:me,n:nm,pl}));
cn.on("data",d=>{if(!ok&&d.t==="room"){ok=1;clearTimeout(tm);pr=p;hc=cn}else if(!ok&&d.t==="err"){f(d.m);return}out(d)});
cn.on("close",()=>{if(hc===cn){hc=null;try{p.destroy()}catch(e){}pr=null;err("O host saiu: sala encerrada");out({t:"left"})}})})};
S.send=s=>{let m;try{m=JSON.parse(s)}catch(e){return}
if(m.t==="hello"){nm=cl(m.name,16)||"Piloto";return out({t:"hi",id:me,tok:m.tok||"p2p",room:null})}
if(m.t==="list")return out({t:"list",r:[]});
if(m.t==="create"||m.t==="join"){if(typeof Peer!=="function")return err("PeerJS não carregou (sem internet?)");if(R||hc)return err("Saia da sala atual primeiro");pl=m.plane|0;return m.t==="create"?mk(0):jn(m.code)}
if(m.t==="leave"){lv();return out({t:"left"})}
if(R)hd(me,m);else if(hc&&hc.open)hc.send(m)};
S.close=()=>{lv();S.readyState=3;S.onclose&&S.onclose()}}};
</script>
